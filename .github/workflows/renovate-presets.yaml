---

name: Validate Renovate presets

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "renovate/**"
      - ".github/workflows/renovate-presets.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Validate presets
        run: npx --yes --package renovate -- renovate-config-validator --strict renovate/default.json renovate/library.json
