[tool.poetry]
name = "rctab"
version = "0.1.0"
description = "An Azure subscription management, reporting, and usage monitoring system."
authors = []
license = "MIT"
readme = "README.md"
# Oldest Poetry that may work on this project. Not managed by Renovate:
# bump it by hand when we need a newer Poetry feature.
requires-poetry = ">=2.4"

[tool.poetry.dependencies]
python = "^3.11"
sphinx = {version = "^9.0.4", optional = true}
sphinx-rtd-theme = {version = "^3.1.0", optional = true}
myst-parser = {version = "^5.2.0", optional = true}


[tool.poetry.group.dev.dependencies]

[tool.poetry.extras]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
